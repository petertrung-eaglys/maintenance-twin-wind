scada:
  timestamp_column: "Date and time"   # timestamps are UTC (file metadata)
signals:
  # Confirmed by inspect_data.py in every turbine data file of both farms
  wind_speed: "Wind speed (m/s)"
  power: "Power (kW)"
  wind_direction: "Wind direction (°)"
  nacelle_direction: "Nacelle position (°)"
  ambient_temp: "Ambient temperature (converter) (°C)"
  pitch: "Blade angle (pitch position) A (°)"
  rotor_speed: "Rotor speed (RPM)"
component_signals:
  # Confirmed by inspect_data.py in every turbine data file of both farms.
  # Front/rear bearing = manufacturer "Axle bearing temperature 1/2" (main
  # bearing). Penmanshiel has no values for the main-bearing and gear-oil
  # temperatures (nor pitch) before mid-2018.
  front_bearing_temp: "Front bearing temperature (°C)"
  rear_bearing_temp: "Rear bearing temperature (°C)"
  gear_oil_temp: "Gear oil temperature (°C)"
  gear_oil_inlet_temp: "Gear oil inlet temperature (°C)"
  generator_bearing_front_temp: "Generator bearing front temperature (°C)"
  generator_bearing_rear_temp: "Generator bearing rear temperature (°C)"
  stator_temp: "Stator temperature 1 (°C)"
  nacelle_temp: "Nacelle temperature (°C)"
sampling:
  interval_minutes: 10
cleaning:
  # is_normal rules (clean.py); required signals must all be present
  required: [wind_speed, wind_direction, ambient_temp, power]
  min_wind_speed: 3.0
  max_wind_speed: 25.0
  max_pitch_deg: 5.0           # only checked below rated wind speed
  min_power_kw: 0.0
  standard_pressure_pa: 101325.0
  # Per turbine model (static file "Model"). MM92 from the Kelmarsh repo
  # (first bin at 99 % of rated power). MM82 estimated from 2019-2021 data:
  # 98 % of rated at 14-15 m/s, and median pitch there is 7 deg, as at the
  # MM92's 12 m/s.
  rated_wind_speed:
    MM92: 12.0
    MM82: 14.0
events:
  # Status values that can label faults (Informational rows are not faults)
  fault_statuses: [Stop, Warning]
  # Rows overlapping an event of this status are not normal operation
  stop_status: Stop
fault_labels:
  # component -> exact Stop/Warning messages that label a fault of it,
  # chosen from the inspect_data.py event counts. Left out on purpose:
  # sensor/communication defects (PT100, encoder, "implausible" angle,
  # CMS comm.), routine operation (battery tests, heating, pitch battery
  # charging cycles, oil flushing), generator fan overloads and "High yaw
  # motor current" (1,272 Kelmarsh warnings: too frequent to be faults).
  # No message concerns the main bearing.
  gearbox:
    - High temp. gear bearing 1
    - High temp. gear bearing 2
    - Particle Gear Alarm 10min
    - Particle Gear Alarm 24h
    - Oil filter gear choked
    - Low gearbox oil pressure
    - Missing gear oil (high rpm)
    - Missing gear oil (low rpm)
    - Overload gear oil pump
    - Overload fan oil cooler gear
    - Overload gear bypass filter
    - Reduced power gearbox
    - Implausible gear speed
  generator:
    - High temp. gen. bearing 1
    - Max. temp. gen. bearing 1
    - Service generator brushes
    - Thermistor generator
  pitch:
    - Pitch run-away (hub box v.>=4)
    - Pitch angle deviation
    - Pitch current asymmetry
    - Pitch too slow BP180
    - Pitch error
    - Error pitch converter 1
    - Error pitch converter 2
    - Error pitch converter 3
    - Error lubrication pump pitch
    - Charging circuit pitch
    - Overload fan pitch motor
  yaw:
    - Uncontrolled yaw movement
    - Yaw error
    - Yaw speed high
    - Yaw velocity too low
    - High yaw load
    - Overload yaw motor 1&3
    - Overload yaw motor 2&4
train_test_split:
  # Models fit on normal rows up to train_end; alert thresholds come from
  # the calibration year up to calibration_end, which no model sees (residuals
  # on fitted rows are too small); test and evaluation after it.
  train_end: "2020-12-31 23:50"        # train 2016-2020
  calibration_end: "2021-12-31 23:50"  # calibrate 2021, test 2022-2024
seed: 42
compute:
  # CPU threads for LightGBM (each lightgbm block has n_jobs: *threads)
  # and PyTorch. The machine has 24 cores and is also a desktop.
  threads: &threads 8
physics:
  reference_air_density: 1.225   # kg/m3, IEC 61400-12-1 normalisation
  bin_width: 0.5                 # m/s, method of bins
  min_bin_count: 20              # bins with fewer training rows are dropped
  # Cp is fitted only on bins whose mean power is below this share of rated
  # power: above it the controller limits power, which is not aerodynamics
  # and would not transfer to another rotor size.
  max_power_fraction: 0.95
  cut_in_wind_speed: 3.0         # m/s; expected power is 0 outside
  cut_out_wind_speed: 25.0
thermal:
  # §7.9 thermal models. Every variant predicts a temperature from the
  # operating inputs only (never from the measured temperature after a
  # simulation start), so a component running hotter than normal shows as
  # a residual. See README "Thermal models".
  targets:                       # temperature signal -> component
    gear_oil_temp: gearbox
    gear_oil_inlet_temp: gearbox
    generator_bearing_front_temp: generator
    generator_bearing_rear_temp: generator
    stator_temp: generator
    front_bearing_temp: main_bearing
    rear_bearing_temp: main_bearing
  reference: nacelle_temp        # T_nac in the heat balance
  power_scale_kw: 1000.0         # P in MW inside the heat balance
  rotor_speed_scale_rpm: 15.0    # rotor speed / 15 rpm (cooling term)
  # Rolling means (time windows, minutes) of the inputs: the "recent
  # history" features of the LightGBM, hybrid and PINN variants.
  history_inputs: [power, rotor_speed, ambient_temp, nacelle_temp]
  history_windows_min: [60, 360, 1440]
  device: auto                   # cuda if available, else cpu
  physics:
    # C dT/dt = c + a P + b P^2 - (h0 + h1 w)(T - T_nac), h0, h1 > 0,
    # fitted per turbine on the error of day-long free-run simulations.
    sequence_steps: 144          # one day of 10-minute steps
    warmup_steps: 36             # 6 h after a (re)start are not predicted
    iterations: 800
    learning_rate: 0.02
    # random sequences per step (of ~37k); all at once kept the GPU at
    # full load for minutes (the PC rebooted during such a run)
    batch_sequences: 4096
  pinn:
    # One network per target for all turbines of both farms.
    hidden: 64
    layers: 2
    embedding_dim: 4
    # lambda; ODE residual in degC per hour. Stator tuning (README): 0 and
    # 0.01 give the same test RMSE, but 0.01 cuts the ODE residual from
    # 25 to 6.5 degC/h; 1 and 10 cost 1-2.6 degC of RMSE.
    ode_weight: 0.01
    steps: 10000
    batch_per_turbine: 256        # rows per turbine per step
    learning_rate: 0.001
alerts:
  # §7.10. residual = measured - expected on normal rows, smoothed with a
  # rolling time-window mean. The threshold is a quantile of the smoothed
  # residuals of the calibration year (no model saw it), on the side that
  # signals a problem. Alerts are raised after train_end only.
  window: 24h                  # rolling mean (time window)
  min_samples: 36              # normal rows needed in the window (6 h)
  quantile: 0.995              # 0.5 % of calibration time beyond threshold
  min_duration_hours: 6
  max_gap_hours: 6             # longer gaps split an exceedance
  # A model's alerts less than this apart are one alert (the same gap as
  # evaluation.merge_gap_days; a sustained problem crosses the threshold
  # many times). Chosen before looking at detection results.
  merge_gap_days: 7
  direction:                   # which side of the residual is a problem
    PowerModel: low            # underperformance
    PitchModel: both
    ThermalModel: high         # overheating
  # Yaw: identified rolling-window offset vs the static offset
  yaw_drift_deg: 4.0
  # Temperatures are scored only while the turbine produces at least this
  # power: they depend on load, and low-load hours dilute a hot component.
  min_power_kw:
    ThermalModel: 500.0
  # Fleet-relative score: each turbine's smoothed residual minus the median
  # of the other turbines of its farm (same model, same timestamp), which
  # removes weather, season and drift common to the farm. Needs at least
  # fleet_min_turbines others with a value.
  fleet_relative: true
  fleet_min_turbines: 3
  # Drift alerts: the monthly mean score stays above the calibration year's
  # mean by `margin` (model units) for at least `months` months in a row.
  drift:
    months: 3
    margin:
      PowerModel: 20.0         # kW
      PitchModel: 0.5          # deg
      ThermalModel: 1.0        # degC
evaluation:
  # An event is detected when an alert of the same turbine and component
  # starts at most lookback_days before it. Events of one turbine and
  # component less than merge_gap_days apart are one episode (Penmanshiel
  # repeats "Missing gear oil" stops for weeks).
  lookback_days: 30
  merge_gap_days: 7
  # Signal scope: the fault messages a residual of each signal can precede
  # (heat, cooling or temperature trips), chosen from the physics before
  # looking at results. Other signals (power, pitch) use all events of their
  # component; the component scope is reported for every signal too.
  signal_events:
    gear_oil_temp: &gear_heat
      - High temp. gear bearing 1
      - High temp. gear bearing 2
      - Overload fan oil cooler gear
      - Oil filter gear choked
      - Reduced power gearbox
    gear_oil_inlet_temp: *gear_heat
    generator_bearing_front_temp: &gen_bearing
      - High temp. gen. bearing 1
      - Max. temp. gen. bearing 1
    generator_bearing_rear_temp: *gen_bearing
    stator_temp:
      - Thermistor generator
  # Detection vs false alarms: thresholds at these calibration quantiles
  curve_quantiles: [0.9, 0.95, 0.98, 0.99, 0.995, 0.999]
yaw:
  # Static yaw misalignment per turbine (yaw.py): power ratio to the
  # turbine's training power curve vs measured misalignment, fitted as
  # a cos^k(gamma - offset). Only below rated, where misalignment costs power.
  wind_speed_range: [5.0, 10.0]  # m/s, density-normalised
  max_misalignment_deg: 25.0     # misalignment bins used in the fit
  bin_width_deg: 1.0
  min_bin_count: 20
  min_bins: 8                    # fewer usable bins: no fit
  # The offset counts as identified only if the mean ratio of the edge_bins
  # outermost bins on each side is at least min_peak_drop below the fitted
  # peak (a peak visible in the data). Kelmarsh: <= 0 %, Penmanshiel:
  # >= 9 % (README).
  edge_bins: 3
  min_peak_drop: 0.05
  window_days: 90                # rolling windows for drift
  step_days: 30
models:
  # One entry per model variant. inputs are sensors (graph kt:hasInput);
  # features are the columns the model sees (derived from the inputs).
  power_baseline:
    model_class: PowerModel
    component: generator
    variant: baseline
    inputs: [wind_speed, wind_direction, ambient_temp]
    features: [wind_speed, wind_dir_sin, wind_dir_cos, ambient_temp, air_density]
    target: power
    monotone_increasing: [wind_speed]   # expected power never drops with wind
    lightgbm:
      n_estimators: 300
      n_jobs: *threads
  power_physics:
    # Cp(v_n) curve per turbine type (method of bins), P = 1/2 rho0 A Cp v_n^3
    model_class: PowerModel
    component: generator
    variant: physics
    inputs: [wind_speed, ambient_temp]
    target: power
  power_hybrid:
    # physics prediction + LightGBM model of its residual, per turbine
    model_class: PowerModel
    component: generator
    variant: hybrid
    inputs: [wind_speed, wind_direction, ambient_temp]
    features: [wind_speed, wind_dir_sin, wind_dir_cos, ambient_temp, air_density]
    target: power
    lightgbm:
      n_estimators: 300
      n_jobs: *threads
  pitch_physics:
    # binned pitch(v_n) per turbine type, above rated wind speed only
    model_class: PitchModel
    component: pitch
    variant: physics
    inputs: [wind_speed, ambient_temp]
    target: pitch
  pitch_hybrid:
    # physics prediction + LightGBM model of its residual, per turbine. No
    # direction features: they overfit (PEN T01 train 0.64 vs test 1.34 deg).
    model_class: PitchModel
    component: pitch
    variant: hybrid
    inputs: [wind_speed, ambient_temp]
    features: [wind_speed, ambient_temp, air_density]
    target: pitch
    lightgbm:
      n_estimators: 300
      n_jobs: *threads
  yaw:
    # power under misalignment, a cos^k(gamma - offset) x power curve
    model_class: YawModel
    component: yaw
    variant: physics
    inputs: [wind_speed, wind_direction, nacelle_direction, ambient_temp]
    target: power
  # Thermal models: component, target and qualifier (= target) are set per
  # target from thermal.targets; features from thermal.history_*.
  thermal_physics:
    model_class: ThermalModel
    variant: physics
    inputs: [power, rotor_speed, nacelle_temp]
  thermal_baseline:
    # LightGBM only
    model_class: ThermalModel
    variant: baseline
    inputs: [power, rotor_speed, ambient_temp, nacelle_temp]
    lightgbm:
      n_estimators: 300
      n_jobs: *threads
  thermal_hybrid:
    # physics free-run + LightGBM residual; the residual model also sees
    # the physics prediction (without it the hybrid was worse than LightGBM)
    model_class: ThermalModel
    variant: hybrid
    inputs: [power, rotor_speed, ambient_temp, nacelle_temp]
    base_as_feature: true
    lightgbm:
      n_estimators: 300
      n_jobs: *threads
